<form class="form" [formGroup]="changePasswordForm">
  <div class="form-group">
    <label for="">
      {{ "NEDSS.HOME.CHANGE_PASSWORD.CURRENT_PASSWORD" | translate  }}
      <span class="required-star">*</span></label>
    <input  type="password" name="password" id="password" class="form-control" formControlName="currentPassword" >
    <small *ngIf="changePasswordForm.controls['currentPassword'].touched &&
    changePasswordForm.controls['currentPassword'].errors" class="form-text  text-danger">
    {{"NEDSS.COMMON.FILEDREQUIRED" | translate}}</small>
  </div>

  <div class="form-group">
    <label for="">{{ "NEDSS.HOME.CHANGE_PASSWORD.NEW_PASSWORD" | translate  }}<span class="required-star">*</span></label>
    <input  type="password" name="password" id="password" class="form-control"  formControlName="newPassword" >
    <small *ngIf="changePasswordForm.controls['newPassword'].touched &&
      changePasswordForm.controls['newPassword'].errors" class="form-text  text-danger">
      {{"NEDSS.COMMON.FILEDREQUIRED" | translate}}</small>
  </div>

  <div class="form-group">
    <label for="">{{ "NEDSS.HOME.CHANGE_PASSWORD.CONFIREM_PASSWORD" | translate  }} <span class="required-star">*</span></label>
    <input  type="password" name="password" id="password" class="form-control"  formControlName="confirmPassword" >
    <small *ngIf="changePasswordForm.controls['confirmPassword'].touched &&
      changePasswordForm.controls['confirmPassword'].errors" class="form-text  text-danger">
      {{"NEDSS.COMMON.FILEDREQUIRED" | translate}}</small>
  </div>

</form>
