<section class="reports-page">
  <div class="reports-selector">
    <div class="reports-header">
      <h4>{{ "NEDSS.HOME.SIDE_BAR.ITEM_REPORTS" | translate }}</h4>
      <p>{{ "NEDSS.REPORTS.REPORTS_SELECTOR_SUBTITLE" | translate }}</p>
    </div>

    <p-dropdown
      styleClass="w-100 report-dropdown"
      [options]="reportOptions"
      optionLabel="label"
      optionValue="key"
      [ngModel]="selectedKey"
      (ngModelChange)="onReportChange($event)"
      [filter]="true"
      filterBy="label"
      [showClear]="true"
      [placeholder]="'NEDSS.REPORTS.SELECT_REPORT' | translate"
      [emptyFilterMessage]="'NEDSS.REPORTS.NO_MATCHING_REPORTS' | translate"
    ></p-dropdown>
  </div>

  <div class="report-host" *ngIf="selectedReport; else emptyState">
    <ng-container *ngComponentOutlet="selectedReport.component"></ng-container>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <i class="bi bi-file-earmark-bar-graph"></i>
      {{ "NEDSS.REPORTS.NO_REPORT_SELECTED" | translate }}
    </div>
  </ng-template>
</section>
