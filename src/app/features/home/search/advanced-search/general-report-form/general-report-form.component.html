<div class="card-body bg-dark-mode">
  <div class="row">
    <div class="col-xl-3 col-md-6 mb-2" *ngIf="parts?.showGovernments">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.GOVERBMENT" | translate }}</label>
        <p-dropdown [appDropdownLoading]="governmentsLoading" (onChange)="onGovernmentChanged()" [options]="governments"
          [(ngModel)]="patient.incidentGovernmentId" [disabled]="!parts?.enableGovernments"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="incidentGovernmentId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2" *ngIf="parts?.showDepartments">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.HEALTHADMIN" | translate }}</label>
        <p-dropdown [appDropdownLoading]="healthAdministrationLoading" (onChange)="onHealthAdministrationChanged()"
          [options]="healthAdministration" [(ngModel)]="patient.incidentHealthAdministrationId"
          [disabled]="!parts?.enableDepartments"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="incidentHealthAdministrationId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2" *ngIf="parts?.showUniversities">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.CONTROL_PANEL.CODES.LOOKUP_THE_UNIVERSITY" | translate }}</label>
        <p-dropdown [appDropdownLoading]="branchesLoading" (onChange)="branchSelected()" [options]="branches"
          [(ngModel)]="patient.incidentBranchId" [disabled]="!parts?.enableUniversities"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="incidentUniversityId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2" *ngIf="parts?.showBranches">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.CONTROL_PANEL.CODES.LOOKUP_THE_BRANCH" | translate }}</label>
        <p-dropdown [appDropdownLoading]="branchesLoading" (onChange)="branchSelected()" [options]="branches"
          [(ngModel)]="patient.incidentBranchId" [disabled]="!parts?.enableBranches"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="incidentBranchId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2" *ngIf="parts?.showAreas">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.CONTROL_PANEL.CODES.LOOKUP_THE_AREA" | translate }}</label>
        <p-dropdown [appDropdownLoading]="areasLoading" (onChange)="areaSelected()" [options]="areas"
          [(ngModel)]="patient.incidentAreaId" [disabled]="!parts?.enableAreas"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="incidentAreaId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2" *ngIf="parts?.showSources">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.INCIDENT_SOURCE" | translate }}</label>
        <p-dropdown [appDropdownLoading]="incidentSourcesLoading" [options]="incidentSources"
          [(ngModel)]="patient.incidentSourceId" [disabled]="!parts?.enableSources"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="incidentSourceId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.DEPARTMENT" | translate }}</label>
        <p-dropdown [appDropdownLoading]="departmentsLoading" [options]="departments" (onChange)="onDepartmentChanged()"
          [(ngModel)]="patient.incidentDepartmentId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="incidentDepartmentId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>
          {{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.DATE_DISCOVER_STATUS" | translate }}
          ({{ "NEDSS.COMMON.FROM" | translate }})
        </label>
        <app-date-field [(ngModel)]="patient.startDate" name="startDate"></app-date-field>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>
          {{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.DATE_DISCOVER_STATUS" | translate }}
          ({{ "NEDSS.COMMON.TO" | translate }})
        </label>
        <app-date-field [min]="patient.startDate" [(ngModel)]="patient.endDate" name="endDate"></app-date-field>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.TIME_DISCOVER_STATUS" | translate }}</label>
        <input type="time" name="caseDiscoveryTime" [ngModel]="patient.caseDiscoveryTime"
          (ngModelChange)="onCaseDiscoveryTimeChanged($event)" style="width: 100%"
          [class]="'form-control-' + currentLang" class="datePicker" />
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.NATIONATILY" | translate }}</label>
        <p-dropdown [appDropdownLoading]="nationalitiesLoading" [options]="nationalities"
          [(ngModel)]="patient.nationalityId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="nationalityId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.NATIONAL_ID" | translate }}</label>
        <input type="text" inputmode="numeric" name="nationalId" class="w-100" maxlength="14" pInputText
          [ngModel]="patient.nationalId" (ngModelChange)="onNationalIdChanged($event)"
          (keypress)="generalDataService.onIdentityCardKeyPress($event)" />
        <small *ngIf="!generalDataService.isCardIdValid" class="form-text text-danger mess-color d-block">
          {{ generalDataService.cardIdValidationMessage | translate }}
        </small>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.PASSPOR_NO" | translate }}</label>
        <input type="text" name="passportNo" class="w-100" maxlength="20" pInputText
          [ngModel]="patient.passportNo" (ngModelChange)="onPassportNoChanged($event)" />
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label>{{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.RELATION_SHIO_DEGREEID" | translate }}</label>
        <p-dropdown [options]="relations" [(ngModel)]="patient.relationShipDegreeId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="relationShipDegreeId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-12 d-flex justify-content-end mt-1">
      <button type="button" class="btn btn-outline-secondary" (click)="clearAll()">
        <span class="pi pi-times"></span>
        {{ "NEDSS.SEARCH.CLEAR_ALL" | translate }}
      </button>
    </div>
  </div>
</div>
