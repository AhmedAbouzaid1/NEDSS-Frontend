<div class="card-body bg-dark-mode">
  <div class="row">
    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label class="form-label">{{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.GOVERNMENT" | translate }}</label>
        <p-dropdown [appDropdownLoading]="governmentsLoading" (onChange)="onGovernmentChanged()" [options]="governments"
          [(ngModel)]="patient.homeGovernmentId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="homeGovernmentId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label class="form-label">{{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.ADMINISTRATION" | translate }}</label>
        <p-dropdown [appDropdownLoading]="healthAdministrationsLoading" (onChange)="onHealthAdministrationChanged()"
          [options]="healthAdministrations" [(ngModel)]="patient.homeHealthAdministrationId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="homeHealthAdministrationId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label class="form-label">{{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.HEALTHOFFICE" | translate }}</label>
        <p-dropdown [appDropdownLoading]="healthOfficesLoading" [options]="healthOffices"
          [(ngModel)]="patient.homeHealthOfficeId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="homeHealthOfficeId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label class="form-label">{{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.STATEANDCITY" | translate }}</label>
        <p-dropdown [appDropdownLoading]="citiesLoading" (onChange)="onCityChanged()" [options]="cities"
          [(ngModel)]="patient.homeCityId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="homeCityId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-2">
      <div class="form-group">
        <label class="form-label">{{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.REGION" | translate }}</label>
        <p-dropdown [appDropdownLoading]="principalitiesLoading" [options]="principalities"
          [(ngModel)]="patient.homePrincipalityId"
          [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
          [style]="{ width: '100%' }" name="homePrincipalityId" [filter]="true"
          [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
        </p-dropdown>
      </div>
    </div>

    <div class="col-xl-6 col-md-12 mb-2">
      <div class="form-group">
        <label class="form-label">{{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.DETAILADDRESS" | translate }}</label>
        <textarea rows="2" pInputText name="livingAddress" class="w-100" [ngModel]="patient.livingAddress"
          (ngModelChange)="onLivingAddressChanged($event)"
          (blur)="generalDataService.isAdressValid = generalDataService.validateAddress(patient.livingAddress, false)"></textarea>
        <small *ngIf="!generalDataService.isAdressValid" class="form-text text-danger mess-color d-block">
          {{ generalDataService.addressValidationMessage | translate }}
        </small>
      </div>
    </div>

    <div class="col-12 d-flex justify-content-end mt-1">
      <button type="button" class="btn btn-outline-secondary" (click)="clearAll()">
        <span class="pi pi-times"></span>
        {{ "NEDSS.SEARCH.CLEAR_ALL" | translate }}
      </button>
    </div>
  </div>
</div>
