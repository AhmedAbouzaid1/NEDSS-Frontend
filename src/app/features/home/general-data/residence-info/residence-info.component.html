<app-loader *ngIf="loadingPanel"></app-loader>
<!-- <div class="form-titles">
   {{'NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.PLACEHOME' | translate }}
</div> -->
<div class="card animate__animated animate__zoomInDown shadow mb-4">
  <div class="card-body bg-dark-mode">
    <div class="row">
      <div class="col-md-6 mt-3">
        <div class="form-group">
          <label for="" class="form-label">
            {{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.GOVERNMENT" | translate }}
            <span class="text-danger mess-color">*</span>
          </label>
          <p-dropdown (onChange)="onGovernmentChanged()" [options]="governments" [(ngModel)]="selectedGovernmentId"
            [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
            [style]="{ width: '100%' }" name="governments" [filter]="true"
            [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
          </p-dropdown>
          <small *ngIf="generalDataService.showValidationErrors && !generalDataService.isHomeGovernmentValid" class="form-text text-danger mess-color">
            {{ "NEDSS.COMMON.FILEDREQUIRED" | translate }}
          </small>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.ADMINISTRATION" | translate
            }}
            <span class="text-danger mess-color">*</span>
          </label>
          <p-dropdown (onChange)="onHealthAdministrationChanged()" [options]="healthAdministrations"
            [(ngModel)]="selectedHealthAdministrationId"
            [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
            [style]="{ width: '100%' }" name="healthAdministrations" [filter]="true"
            [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
          </p-dropdown>
          <small *ngIf="generalDataService.showValidationErrors && !generalDataService.isHomeHealthAdministrationValid" class="form-text text-danger mess-color">
            {{ "NEDSS.COMMON.FILEDREQUIRED" | translate }}
          </small>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.STATEANDCITY" | translate
            }}
            <span class="text-danger mess-color">*</span>
          </label>
          <p-dropdown (onChange)="onCityChanged()" [options]="cities" [(ngModel)]="selectedCityId"
            [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
            [style]="{ width: '100%' }" name="cities" [filter]="true"
            [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
          </p-dropdown>
          <small *ngIf="generalDataService.showValidationErrors && !generalDataService.isHomeCityValid" class="form-text text-danger mess-color">
            {{ "NEDSS.COMMON.FILEDREQUIRED" | translate }}
          </small>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.HEALTHOFFICE" | translate
            }}
            <span class="text-danger mess-color">*</span>
          </label>
          <p-dropdown (onChange)="onHealthOfficeChanged()" [options]="healthOffices"
            [(ngModel)]="selectedHealthOfficeId"
            [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
            [style]="{ width: '100%' }" name="healthOffices" [filter]="true"
            [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
          </p-dropdown>
          <small *ngIf="generalDataService.showValidationErrors && !generalDataService.isHomeHealthOfficeIdValid" class="form-text text-danger mess-color">
            {{ "NEDSS.COMMON.FILEDREQUIRED" | translate }}
          </small>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="form-group">
          <label for="" class="form-label">
            {{ "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.REGION" | translate }}
          </label>
          <p-dropdown (onChange)="onPrincipalityChanged()" [options]="principalities"
            [(ngModel)]="selectedPrincipalityId"
            [optionLabel]="currentLang === 'ar' ? 'arabicName' : 'englishName'" optionValue="id" autoWidth="false"
            [style]="{ width: '100%' }" name="principalities" [filter]="true"
            [filterBy]="currentLang === 'ar' ? 'arabicName' : 'englishName'">
          </p-dropdown>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="form-outline">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.DETAILADDRESS" | translate
            }}
            <span class="text-danger mess-color">*</span>
          </label>
          <!-- <textarea
            [(ngModel)]="patient.livingAddress"
            (blur)="
              generalDataService.isAdressValid =
                generalDataService.validateAddress(patient.livingAddress, false)
            "
            class="form-control"
          ></textarea> -->
          <textarea rows="3" pInputTextarea [(ngModel)]="patient.livingAddress" class="w-100" (blur)="
              generalDataService.isAdressValid =
                generalDataService.validateAddress(patient.livingAddress, true)
            "></textarea>
        </div>
        <small *ngIf="generalDataService.showValidationErrors && !generalDataService.isAdressValid" class="form-text text-danger mess-color">
          {{ generalDataService.addressValidationMessage | translate }}
        </small>
      </div>
      <div class="col-md-6 mt-3" *ngIf="patient.newHomeGovernment">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.NEW_GOVERNMENT" | translate
            }}
          </label>
          <input type="text" name="newHomeGovernment" [(ngModel)]="patient.newHomeGovernment"
            #newHomeGovernment="ngModel" pInputText class="w-100" disabled />
        </div>
      </div>
      <div class="col-md-6 mt-3" *ngIf="patient.newHomeHealthAdministration">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.NEW_ADMINISTRATION"
            | translate
            }}
          </label>
          <input type="text" name="newHomeHealthAdministration" [(ngModel)]="patient.newHomeHealthAdministration"
            #newHomeHealthAdministration="ngModel" pInputText class="w-100" disabled />
        </div>
      </div>
      <div class="col-md-6 mt-3" *ngIf="patient.newHomeCity">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.NEW_STATEANDCITY"
            | translate
            }}
          </label>
          <input type="text" name="newHomeCity" [(ngModel)]="patient.newHomeCity" #newHomeCity="ngModel" pInputText
            class="w-100" disabled />
        </div>
      </div>
      <div class="col-md-6 mt-3" *ngIf="patient.newHomeHealthOffice">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.NEW_HEALTHOFFICE"
            | translate
            }}
          </label>
          <input type="text" name="newHomeHealthOffice" [(ngModel)]="patient.newHomeHealthOffice"
            #newHomeHealthOffice="ngModel" pInputText class="w-100" disabled />
        </div>
      </div>
      <div class="col-md-6 mt-3" *ngIf="patient.newLivingAddress">
        <div class="form-group">
          <label for="" class="form-label">
            {{
            "NEDSS.HOME.GENERAL_DATA_RESIDENCEINFO.NEW_DETAILADDRESS"
            | translate
            }}
          </label>
          <textarea rows="3" pInputTextarea [(ngModel)]="patient.newLivingAddress" class="w-100" disabled></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
