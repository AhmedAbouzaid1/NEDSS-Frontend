<div class="row">
  <div class="col-12 mb-4">
    <app-side-menu
      [completedTabs]="completedTabs"
      [activeAllTabs]="activeAllTabs"
      [currentTab]="currentTab"
      [active]="activeTab"
      (onTabChange)="onTabChange($event)"
      *ngIf="!isLoadingData"
    ></app-side-menu>
  </div>
  <div class="col-12">
    <!-- <div class="tab-content" id="nav-tabContent">

    </div> -->
    <!-- <router-outlet></router-outlet> -->
  </div>
  <div class="d-flex justify-content-end gap-3">
    <button
      *ngIf="
        !sharedDataService.inSential &&
        (finalTab ||
          (generalDataEnum.DiagnosticInfo == activeTab &&
            !patient.fields?.length &&
            !sharedDataService.ShowSentinel &&
            !(activeAllTabs && !finalTab)))
      "
      type="submit"
      tabindex="0"
      class="btn btn-lg bg text-light"
      (click)="addPatient()"
      [disabled]="loadingPanel"
    >
      <span
        [class]="
          'bi bg ' +
          (finalTab ||
          (generalDataEnum.DiagnosticInfo == activeTab &&
            !patient.fields?.length &&
            !sharedDataService.ShowSentinel)
            ? 'bi-check2-circle'
            : '')
        "
      ></span>
      {{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.SAVE" | translate }}
    </button>
    <button
      *ngIf="
        !sharedDataService.inSential &&
        !finalTab &&
        !(
          finalTab ||
          (generalDataEnum.DiagnosticInfo == activeTab &&
            !patient.fields?.length &&
            !sharedDataService.ShowSentinel)
        )
      "
      type="submit"
      tabindex="0"
      class="btn btn-lg bg text-light"
      (click)="addPatient()"
      [disabled]="loadingPanel"
    >
      {{ "NEDSS.COMMON.NEXT" | translate }}
    </button>
    <button
      *ngIf="
        sharedDataService.inSential && finalTab && !(activeAllTabs && !finalTab)
      "
      type="submit"
      tabindex="1"
      class="btn btn-lg bg text-light"
      (click)="addPatient()"
      [disabled]="loadingPanel"
    >
      <span [class]="'bi bg ' + (finalTab ? 'bi-check2-circle' : '')"></span>
      {{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.SAVE" | translate }}
    </button>

    <button
      *ngIf="activeAllTabs && !finalTab"
      tabindex="1"
      type="submit"
      class="btn btn-lg bg text-light"
      (click)="save()"
      [disabled]="loadingPanel"
    >
      <span [class]="'bi bg ' + (finalTab ? 'bi-check2-circle' : '')"></span>
      {{ "NEDSS.HOME.GENERAL_DATA_COMPLETION.SAVE" | translate }}
    </button>
  </div>
</div>
