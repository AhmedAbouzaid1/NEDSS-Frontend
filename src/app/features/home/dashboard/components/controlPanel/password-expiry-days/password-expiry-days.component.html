<h2 class="titles">
  {{ "NEDSS.HOME.CONTROL_PANEL.PASSWORD_EXPIRY_DAYS" | translate }}
</h2>

<form (ngSubmit)="save()" #userForm="ngForm" novalidate>
  <div class="card shadow color">
    <div class="card-body bg-dark-mode">
      <div class="row">
        <div class="col-lg-12 mb-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="pwExpiryEnabled"
              name="enabled" [(ngModel)]="enabled">
            <label class="form-check-label" for="pwExpiryEnabled">
              {{ "NEDSS.HOME.CONTROL_PANEL.PASSWORD_EXPIRY_ENABLED" | translate }}
            </label>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="form-group">
            <label for="expiryDays">
              {{ "NEDSS.HOME.CONTROL_PANEL.PASSWORD_EXPIRY_DAYS" | translate }}
              <span class="text-muted">{{ "NEDSS.HOME.CONTROL_PANEL.PASSWORD_EXPIRY_DAYS_HINT" | translate }}</span>
              <span class="text-danger" *ngIf="enabled">*</span>
            </label>
            <input type="text" name="expiryDays" [(ngModel)]="expiryDays" class="form-control"
              [disabled]="!enabled" (keypress)="onNumberKeyPress($event)" [required]="enabled">
            <div *ngIf="userForm.controls.expiryDays?.touched && userForm.controls.expiryDays?.errors?.required"
              class="form-text text-danger">
              {{"NEDSS.COMMON.FILEDREQUIRED" | translate}}
            </div>
            <div *ngIf="!isValid" class="form-text text-danger">
              {{ currentLang == 'ar' ? 'الحد الأدنى 5 أيام' : 'Minimum is 5 days' }}
            </div>
          </div>
        </div>
      </div>

      <div class="card-footer text-start" style="text-align:center !important">
        <button type="submit" [disabled]="userForm.invalid" class="btn bg text-white rounded-2">
          {{ "NEDSS.COMMON.SAVE" | translate }}
        </button>
      </div>
    </div>
  </div>
</form>
