<h2 class="titles">
  {{ "NEDSS.HOME.CONTROL_PANEL.DATA_FETCH_DAYS" | translate }}
</h2>

<form (ngSubmit)="save()" #userForm="ngForm" novalidate>
  <div class="card shadow color">
    <div class="card-body bg-dark-mode">
      <div class="row">
        <div class="col-lg-4">
          <div class="form-group">
            <label for="daysLimit">
              {{ "NEDSS.HOME.CONTROL_PANEL.DATA_FETCH_DAYS" | translate }}
              <span class="text-muted">{{ "NEDSS.HOME.CONTROL_PANEL.DATA_FETCH_DAYS_HINT" | translate }}</span>
              <span class="text-danger">*</span>
            </label>
            <input type="text" name="daysLimit" [(ngModel)]="daysLimit" class="form-control"
              (keypress)="onNumberKeyPress($event)" required>
            <div *ngIf="userForm.controls.daysLimit?.touched && userForm.controls.daysLimit?.errors?.required"
              class="form-text text-danger">
              {{"NEDSS.COMMON.FILEDREQUIRED" | translate}}
            </div>
            <div *ngIf="!isValid" class="form-text text-danger">
              {{"NEDSS.COMMON.INVALID_NUMBER" | translate }}
            </div>
          </div>
        </div>
      </div>

      <div class="card-footer text-start" style="text-align:center !important">
        <button type="submit" [disabled]="userForm.invalid" class="btn bg text-white rounded-2">
          {{ "NEDSS.COMMON.SAVE" | translate }}
        </button>
      </div>
    </div>
  </div>
</form>
