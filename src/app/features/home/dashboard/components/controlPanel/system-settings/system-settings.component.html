<h2 class="titles">
  {{ "NEDSS.HOME.CONTROL_PANEL.ITEM_NVESTIGTIONPERCENTAGE" | translate }}
</h2>

<form (ngSubmit)="save()" #userForm="ngForm" novalidate>
  <div class="card shadow color">
    <div class="card-body bg-dark-mode">
      <div class="row" #myTableElementId>
        <div class="col-lg-4">
          <div class="form-group">
            <label for="fullName">
              {{
              "NEDSS.HOME.CONTROL_PANEL.ITEM_NVESTIGTIONPERCENTAGE" | translate
              }}<span class="text-muted">(0-100)</span>
              <span class="text-danger">*</span>
            </label>
            <input type="text" name="percentage" [(ngModel)]="percentage" class="form-control"
              (keypress)="onNumberKeyPress($event)" required>
            <div *ngIf="userForm.controls.percentage?.touched && userForm.controls.percentage?.errors?.required"
              class="form-text text-danger">
              {{"NEDSS.COMMON.FILEDREQUIRED" | translate}}
            </div>
            <div *ngIf="!isValid" class="form-text text-danger">
              {{"NEDSS.COMMON.INVALID_PERCENTAGE" | translate }}
            </div>
          </div>
        </div>

      </div>

      <div class="card-footer text-start" style="text-align:center !important">
        <button type="submit" [disabled]="userForm.invalid" class="btn bg text-white rounded-2">
          {{ "NEDSS.COMMON.SAVE" | translate }}
        </button>
      </div>
    </div>
  </div>
</form>
